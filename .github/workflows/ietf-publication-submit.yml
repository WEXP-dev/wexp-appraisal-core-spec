name: IETF submission preview (LIVE DISABLED)

# Consumes an already frozen, separately public-authorized bundle. No build and
# no POST. Enabling hosted submission requires a separately reviewed durable
# attempt store and actual Settings review, not merely setting a variable.

on:
  workflow_dispatch:
    inputs:
      identity:
        description: 'Exact Internet-Draft name and revision'
        required: true
        type: string
      bundle_commit:
        description: 'Full public commit containing the frozen data and records'
        required: true
        type: string
      bundle_path:
        description: 'Bundle directory relative to that commit'
        required: true
        type: string
      expected_manifest_sha256:
        description: 'MANIFEST.json digest from the reviewed author decision'
        required: true
        type: string
      author_decision_path:
        description: 'Public-authorized decision record outside the bundle'
        required: true
        type: string
      expected_decision_sha256:
        description: 'Digest of that decision record'
        required: true
        type: string
      review_record_path:
        description: 'Public-authorized review record outside the bundle'
        required: true
        type: string
      expected_review_sha256:
        description: 'Digest of that review record'
        required: true
        type: string
      user:
        description: 'Submitter account covered by the decision; preview only'
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview:
    if: github.repository == 'WEXP-dev/wexp-spec' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed tool revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require an exact data commit
        env:
          DATA_COMMIT: ${{ inputs.bundle_commit }}
        run: |
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r"[0-9a-f]{40}", os.environ["DATA_COMMIT"]):
              raise SystemExit("A full commit SHA is required")
          PY

      - name: Check out frozen inputs as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.bundle_commit }}
          path: frozen-input
          persist-credentials: false

      - name: Preview the exact approved request without sending
        env:
          IDENTITY: ${{ inputs.identity }}
          BUNDLE_PATH: ${{ inputs.bundle_path }}
          MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          DECISION_PATH: ${{ inputs.author_decision_path }}
          DECISION_SHA256: ${{ inputs.expected_decision_sha256 }}
          REVIEW_PATH: ${{ inputs.review_record_path }}
          REVIEW_SHA256: ${{ inputs.expected_review_sha256 }}
          SUBMITTER: ${{ inputs.user }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          import draft_bundle
          import submit_publication
          root = Path("frozen-input").resolve()
          paths = {}
          for key in ("BUNDLE_PATH", "DECISION_PATH", "REVIEW_PATH"):
              draft_bundle.safe_name(os.environ[key])
              path = root / os.environ[key]
              if not path.resolve().is_relative_to(root):
                  raise SystemExit("Input escapes the data checkout")
              paths[key] = str(path)
          # Source code comes from the tool checkout, never from frozen-input.
          # No live option or environment switch is supplied.
          raise SystemExit(submit_publication.main([
              "--bundle-root", paths["BUNDLE_PATH"],
              "--identity", os.environ["IDENTITY"],
              "--expected-manifest-sha256", os.environ["MANIFEST_SHA256"],
              "--author-decision", paths["DECISION_PATH"],
              "--expected-decision-sha256", os.environ["DECISION_SHA256"],
              "--review-record", paths["REVIEW_PATH"],
              "--expected-review-sha256", os.environ["REVIEW_SHA256"],
              "--user", os.environ["SUBMITTER"],
              "--json", "build/submission-preview.json",
          ]))
          PY
